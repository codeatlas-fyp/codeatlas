name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Check branch name and commit messages
        if: github.event_name == 'pull_request'
        run: >
          uv run python scripts/check_commit_msgs.py
          "origin/${{ github.base_ref }}"
          "${{ github.event.pull_request.head.sha }}"
          "${{ github.head_ref }}"

      # Same hooks as on laptops (ruff, ruff-format, whitespace, YAML, gitleaks), so CI matches.
      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Import contracts
        run: uv run lint-imports

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest --cov=codeatlas --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # Builds the deployable image on every PR and smoke-tests the running container, so a change
  # that breaks the Dockerfile or the service is caught before it reaches main (spec §12).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: codeatlas:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name codeatlas -p 8000:8000 codeatlas:ci
          python3 scripts/smoke_test.py http://127.0.0.1:8000 --commit "${{ github.sha }}"

      - name: Container logs and size
        if: always()
        run: |
          docker logs codeatlas || true
          docker image ls codeatlas:ci
