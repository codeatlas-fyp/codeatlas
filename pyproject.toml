[project]
name = "codeatlas"
version = "0.1.0"
description = "Traceability between Jira requirements and GitHub code changes."
readme = "README.md"
authors = [
    { name = "Areej Hamid", email = "areejhamid8560@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "githubkit>=0.16.1",
    "httpx>=0.28.1",
    "orjson>=3.12.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pygit2>=1.20.1",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
codeatlas = "codeatlas.cli:app"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mutmut>=3.8.0",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The mid-evaluation spec is kept verbatim; ruff would reformat its code blocks.
extend-exclude = ["docs/specs/mid-eval-spec.md"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ", "S"]  # DTZ: naive datetimes; S: security (spec §16)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]  # asserts, fake secrets, fixed git commands
"scripts/**" = ["S603", "S607"]  # fixed git commands, no user input in a shell

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# External network is blocked in every test (spec §13); HTTP is mocked with respx. Localhost
# stays open because asyncio on Windows builds its event loop from a localhost socket pair.
addopts = "--allow-hosts=127.0.0.1,::1"

[tool.coverage.run]
branch = true
source = ["codeatlas"]
