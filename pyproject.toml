[project]
name = "codeatlas"
version = "0.1.0"
description = "Traceability between Jira requirements and GitHub code changes."
readme = "README.md"
authors = [
    { name = "Areej Hamid", email = "areejhamid8560@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "githubkit>=0.16.1",
    "httpx>=0.28.1",
    "orjson>=3.12.0",
    "pydantic>=2.13.5",
    "pygit2>=1.20.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
codeatlas = "codeatlas.cli:app"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]  # DTZ flags naive datetimes (UTC convention)

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
